site_name: Cade Clonts
site_description: Cade Clonts — electrical engineer working in embedded hardware, power electronics, and controls. Engineering project portfolio.
site_url: https://skyworrio.github.io
repo_url: https://github.com/Skyworrio
repo_name: Skyworrio
edit_uri: ""

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.png
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.tooltips
    - search.suggest
    - search.highlight

markdown_extensions:
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.tilde
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
  - glightbox:
      skip_classes:
        - off-glb

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

# Pages ending in _draft.md are built locally with `mkdocs serve` but never deployed.
draft_docs: |
  **/*_draft.md

not_in_nav: |
  assets

copyright: "&copy; 2026 Cade Clonts"

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Skyworrio
      name: GitHub
    # TODO: add your real handle/address, then uncomment (also update the Contact section on index.md)
    # - icon: fontawesome/brands/linkedin
    #   link: https://www.linkedin.com/in/YOUR-LINKEDIN-HANDLE
    #   name: LinkedIn
    # - icon: fontawesome/solid/envelope
    #   link: mailto:YOUR-EMAIL
    #   name: Email

nav:
  - Home: index.md
  - Projects:
      - projects/index.md
      - ESP32 Wi-Fi / MQTT Gateway Board: projects/wifi-mqtt-board/index.md
      - AM Capillary Wicks (Research): projects/capillary-wicks/index.md
      # When a draft is ready: rename projects/<name>_draft.md -> projects/<name>.md and add it here, e.g.
      # - Industry Capstone: projects/capstone.md
      # - Microgrid Design (Xendee): projects/microgrid.md
      # - ROS Color-Tracking Robot: projects/ros-tracking.md
  - Resume: resume.md
